name: Frontend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ls --all
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run check:naming
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys against contract fixtures
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/munsha-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5173/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
